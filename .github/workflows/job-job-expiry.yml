# Failover for Backend/worker.js's job-expiry cron sir — see job-feature-flag-reenable.yml for
# the full explanation of why this file exists and how it's safe to run alongside the EC2 worker
# (short version: Mongo lease in jobLease.js, whichever process is alive wins each tick).
#
# Real EC2 schedule: 0 * * * * UTC (Backend/utils/JobExpiryCron.js). Offset 15 min.
#
# NOTE: this job existed in Backend/jobs/runJob.js's JOBS table all along, but the OLD
# scheduled-jobs.yml never listed it in its workflow_dispatch dropdown or its cron-to-job mapping
# — found during the 2026-11-07 cleanup. It had ZERO failover coverage before this file existed.

name: 'Job: job-expiry'

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        working-directory: Backend
        run: npm ci --omit=dev

      - name: Run job-expiry
        working-directory: Backend
        env:
          NODE_ENV: production
          MONGO_DB_URL: ${{ secrets.MONGO_DB_URL }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          ADMIN_ALERT_EMAIL: ${{ secrets.ADMIN_ALERT_EMAIL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: node jobs/runJob.js job-expiry
