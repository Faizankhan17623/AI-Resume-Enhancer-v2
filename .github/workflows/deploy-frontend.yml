# Frontend deploy sir — two ways in: workflow_dispatch (you click Run workflow + type "deploy",
# for a one-off manual redeploy with no new commit), or workflow_call (ci.yml calls this once its
# own jobs are green on a push to main — see that file's own deploy job). Per direct request
# 2026-11-16, a push to main that passes CI now deploys automatically; this file's actual deploy
# steps didn't need to change, only who's allowed to trigger them without typing "deploy".
# Mirrors exactly the deploy-frontend skill's steps: deploy from the repo root (NOT from
# inside ResumeEnhancer/ — the linked Vercel project's Root Directory is already set to
# ResumeEnhancer, see that skill for why running it from inside the folder breaks the path), then
# verify the live aliased domain actually picked up the new build by comparing bundle hashes.
#
# REQUIRES three repo secrets, Settings -> Secrets and variables -> Actions:
#   VERCEL_TOKEN    a token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID    team_1e4M0s2jQmQh5pWLcp6gjQi8 (from ResumeEnhancer/.vercel/project.json)
#   VERCEL_PROJECT_ID  prj_bjdIgD84bM9WryJDNY8CsWZmxM1i (same file)
# Until all three are set, running this workflow will fail at the deploy step with a clear error.

name: Deploy Frontend (Vercel)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm you want to deploy to production'
        required: true
        type: string
  workflow_call:

# contents: read only sir, per 2026-11-16 audit - this workflow never needs a write-capable
# GITHUB_TOKEN; without an explicit permissions block it runs with whatever the repo-wide
# default is, which could silently be write-capable.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_call has no 'confirm' input to check sir — being CALLED (only ci.yml does, only
    # after its own jobs pass on a push to main) IS the confirmation for that path
    if: github.event_name == 'workflow_call' || github.event.inputs.confirm == 'deploy'
    timeout-minutes: 10
    # same fixed "deploy" group as ci.yml's own deploy-frontend job sir, per 2026-11-27 audit —
    # that file's concurrency block only covers requests that come THROUGH it (a push-to-main
    # auto-deploy). A manual "Run workflow" dispatch of THIS file directly never passed through
    # ci.yml, so nothing serialized it against an auto-deploy landing at the same moment — both
    # could SSH/deploy concurrently. Declaring the group here too means it applies no matter
    # which entry point triggered this run.
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - name: Refuse to continue without explicit confirmation
        if: github.event_name != 'workflow_call' && github.event.inputs.confirm != 'deploy'
        run: |
          echo "::error::Deploy was not confirmed — input 'confirm' must be exactly 'deploy'."
          exit 1

      - uses: actions/checkout@v4

      - name: Deploy to Vercel production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        # from the REPO ROOT sir, not inside ResumeEnhancer/ — see this file's header comment
        run: npx vercel --prod --token="$VERCEL_TOKEN" --yes

      - name: Verify the live domain served the new build
        # vars.PROD_URL sir, per 2026-11-16 audit — was hardcoded here; if the production domain
        # is ever repointed (custom domain swap, project rename) this silently stopped verifying
        # the actual live site with nobody noticing until a bad deploy shipped unverified. Falls
        # back to today's real domain if the repo variable is never set, so this needs no action
        # right now — only matters if the domain changes later (Settings -> Secrets and
        # variables -> Actions -> Variables -> PROD_URL).
        env:
          PROD_URL: ${{ vars.PROD_URL || 'https://ai-resume-enhancer-v2.vercel.app' }}
        run: |
          sleep 10
          LIVE_HASH=$(curl -s "$PROD_URL" | grep -o 'index-[A-Za-z0-9_-]*\.js' | head -1)
          echo "Live bundle hash: $LIVE_HASH"
          if [ -z "$LIVE_HASH" ]; then
            echo "::error::Could not find a bundle hash on the live domain — the deploy may not have gone live yet, or the page structure changed."
            exit 1
          fi
