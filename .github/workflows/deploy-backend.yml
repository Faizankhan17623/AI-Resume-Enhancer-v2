# Backend deploy sir — two ways in: workflow_dispatch (you click Run workflow + type "deploy",
# for a one-off manual redeploy with no new commit), or workflow_call (ci.yml calls this once its
# own jobs are green on a push to main — see that file's own deploy job). Per direct request
# 2026-11-16, a push to main that passes CI now deploys automatically; this file's actual deploy
# steps didn't need to change, only who's allowed to trigger them without typing "deploy".
# Mirrors exactly the steps this project's deploys have always used by hand: SSH in, git pull,
# npm install, restart both PM2 processes.
#
# REQUIRES two repo secrets, Settings -> Secrets and variables -> Actions:
#   EC2_SSH_PRIVATE_KEY   the full contents of airesumeenhancer-backend-eu.pem
#   EC2_HOST              51.20.204.183
# Until both are set, running this workflow will fail at the SSH step with a clear error.

name: Deploy Backend (EC2)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm you want to deploy to production'
        required: true
        type: string
  workflow_call:

# contents: read only sir, per 2026-11-16 audit - this workflow never needs a write-capable
# GITHUB_TOKEN; without an explicit permissions block it runs with whatever the repo-wide
# default is, which could silently be write-capable.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_call has no 'confirm' input to check sir — being CALLED (only ci.yml does, only
    # after its own jobs pass on a push to main) IS the confirmation for that path
    if: github.event_name == 'workflow_call' || github.event.inputs.confirm == 'deploy'
    timeout-minutes: 10

    steps:
      - name: Refuse to continue without explicit confirmation
        if: github.event_name != 'workflow_call' && github.event.inputs.confirm != 'deploy'
        run: |
          echo "::error::Deploy was not confirmed — input 'confirm' must be exactly 'deploy'."
          exit 1

      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key ubuntu@"$EC2_HOST" '
            set -e
            cd ~/app/Backend
            git pull origin main
            npm install --omit=dev
            pm2 restart web
            pm2 restart worker
            pm2 status
          '

      - name: Verify the deployed commit matches what we expect
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          DEPLOYED=$(ssh -i ~/.ssh/deploy_key ubuntu@"$EC2_HOST" 'cd ~/app/Backend && git rev-parse HEAD')
          echo "Deployed commit: $DEPLOYED"
          echo "Expected commit (this workflow run): ${{ github.sha }}"
          if [ "$DEPLOYED" != "${{ github.sha }}" ]; then
            echo "::warning::Deployed commit does not match the commit this workflow ran against — the server may be on a different branch/ref than expected."
          fi
