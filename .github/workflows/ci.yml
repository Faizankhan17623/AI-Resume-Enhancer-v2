# Continuous Integration sir — runs on every push and pull request against main. Lints and
# builds the frontend, and runs the backend test suite. Deployment is a SEPARATE, manual step
# (see deploy-backend.yml / deploy-frontend.yml) — this workflow never deploys anything, it only
# verifies the code is sound before a human decides to ship it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# contents: read only sir, per 2026-11-16 audit - this workflow never needs a write-capable
# GITHUB_TOKEN; without an explicit permissions block it runs with whatever the repo-wide
# default is, which could silently be write-capable.
permissions:
  contents: read

# cancels a superseded run sir, per 2026-11-16 audit — pushing several commits in quick
# succession (rebase, force-push during review) used to queue multiple redundant runs instead
# of canceling the one this new push already supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    # 15 min sir, per 2026-11-16 audit — this job had no timeout at all, so a hung npm ci
    # (registry issue, lockfile drift) would run until the 360-minute GitHub Actions default,
    # burning CI minutes silently on every push/PR to main.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        # --passWithNoTests sir — Backend/tests/ is currently gitignored (local-only test files),
        # so a fresh CI checkout has zero tracked test files and Jest would otherwise exit
        # non-zero on "no tests found", permanently failing this pipeline before any test exists.
        # Backend/package.json's jest config no longer points setupFilesAfterEnv at
        # tests/setup.js (removed — that file is also gitignored, so a fresh checkout doesn't
        # have it either; it pointed at a file that can't exist here). Once real test files,
        # including a committed setup.js, exist in git, restore that setupFilesAfterEnv line
        # and this still runs the real suite normally — this flag only changes what happens
        # when there are none.
        run: npm test -- --passWithNoTests

      - name: Route-collision check
        # per 2026-11-15 audit sir — Backend/tests/ staying gitignored (by explicit request)
        # means the real Jest suite can't run here, so this is the one meaningful backend
        # check CI can still run for free: every Routes/*.js file actually loads with no
        # syntax/require error, AND no two routes collide on the same method+path (the exact
        # check this repo's own .claude/testing.md already tells a human to run by hand after
        # any route change — this just makes CI run it automatically instead of relying on
        # someone remembering to).
        #
        # .env.example copied to .env sir — requiring Routes/index.js loads every controller,
        # and several (Chat.js's Groq client, Razorpay.js, Cloudinary) construct an SDK client
        # at module-load time that throws if its env var is simply missing, not just wrong. No
        # real secret is needed to just load the modules and inspect their route tables, so the
        # committed, secret-free .env.example (placeholder values only) is enough.
        run: |
          cp .env.example .env
          node -e "
            require('dotenv').config();
            const { findCollisions } = require('./Routes/index.js');
            const collisions = findCollisions();
            if (collisions.length > 0) {
              console.error('Route collisions found:', collisions);
              process.exit(1);
            }
            console.log('No route collisions.');
          "

  frontend-lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ResumeEnhancer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ResumeEnhancer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # a placeholder VITE_MAIN_BACKEND_URL sir — the build only needs this set to SOMETHING
        # (see src/utils/backendUrl.js, which errors loudly but doesn't fail the build if unset);
        # CI never actually calls the backend, it only checks the bundle compiles
        env:
          VITE_MAIN_BACKEND_URL: https://ci-build-placeholder.invalid/api/v1
        run: npm run build
